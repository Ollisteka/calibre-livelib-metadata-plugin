name: Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run offline unit tests
        run: python -m pytest
      - name: Build installable plugin ZIP
        run: python scripts/build_plugin.py
